
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Restaurant - Eat & Collect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="entete">
        <h1 id="nom">Chargement...</h1>
        <p id="statut" class="badge">Ouvert</p>
    </header>
    <main>
        <section class="infos">
            <h2>Informations</h2>
            <p>📍 <span id="adresse">...</span></p>
            <p>📞 <span id="telephone">...</span></p>
        </section>
        
        <section>
            <h2>Le Menu</h2>
            <div class="recherche-box">
                <input type="text" id="recherche" placeholder="Rechercher un produit">
                <p id="total-produits"></p>
            </div>
            
            <div id="menu"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
